[build]
  command = "pip install -r requirements.txt && python scripts/update_stats.py && mkdocs build"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.12"

# SPA-szerű fallback nem kell, a mkdocs minden lapot statikusan generál.
# 404-es oldal: mkdocs-material automatikusan 404.html-t generál.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

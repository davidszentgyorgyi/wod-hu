site_name: World of Darkness Wiki Magyarul
site_description: >-
  A World of Darkness (Vampire: The Masquerade, Werewolf: The Apocalypse, Mage: The Ascension
  és a többi WoD-játékvilág) közösségi, magyar nyelvű enciklopédiája. Klánok, diszciplínák,
  frakciók és alapfogalmak fordítása közösségi fordítók munkájával.
site_url: https://wod-hu.netlify.app/
site_author: WoD Wiki Magyar közösség
repo_url: https://github.com/davidszentgyorgyi/wod-hu # TODO: tényleges repo URL beillesztése
repo_name: WoD Wiki HU
edit_uri: edit/main/docs/

copyright: >
  A tartalom a World of Darkness Wiki (whitewolf.fandom.com) fordítása/adaptációja,
  CC BY-SA 4.0 licenc alatt. World of Darkness és kapcsolódó márkanevek a Paradox Interactive tulajdonát képezik.

extra_css:
  - assets/css/extra.css

theme:
  name: material
  language: hu
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Váltás világos módra
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Váltás sötét módra
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  analytics:
    provider: google
    property: G-PGLVSHLK0X
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/davidszentgyorgyi/wod-hu

extra_javascript:
  - assets/js/analytics-events.js

# --- SEO / GEO kritikus beállítások ---
# A mkdocs build automatikusan generál sitemap.xml-t a site_url alapján.
# Minden oldal front matterjében description mezőt várunk (lásd CONTRIBUTING.md) —
# ez kerül a <meta name="description"> tagbe a seo plugin által.

plugins:
  - search:
      lang: hu
  - awesome-pages  # .pages fájlokból vezérelt, de automatikusan bővülő navigáció
# A sitemap.xml generálása beépített mkdocs funkció, külön plugin nem kell.
# TODO: "social" plugin (OG/Twitter kártya automatikus generálás) később bekapcsolható,
# de natív Cairo-függőséget igényel (mkdocs-material[imaging]) — Netlify build image-en
# tesztelni kell előbb, nehogy instabillá tegye a deploy pipeline-t.

markdown_extensions:
  - toc:
      permalink: true
      title: Tartalom
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - def_list

# A nav szekció szándékosan hiányzik — a mkdocs automatikusan generálja a menüt
# a docs/ mappastruktúrából és a fájlok H1 címéből. Ez azt jelenti, hogy egy új
# cikk automatikusan megjelenik a navigációban, mihelyt létrejön, nincs manuális
# lépés. Lásd scripts/check_content_map.py és a README "Szkriptek" szekcióját.
